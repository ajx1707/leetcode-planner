<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - LeetCode Planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css?v=14" />
  <style>
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: radial-gradient(circle at 50% 30%, #111111 0%, #000000 70%);
    }

    .login-card {
      width: 100%;
      max-width: 380px;
      background: var(--bg-panel);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-md);
      padding: 2.2rem 2rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .login-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 1.8rem;
    }

    .login-logo {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }

    .login-title {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--text-primary);
    }

    .login-subtitle {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
    }

    .login-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .login-label {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    .login-input {
      width: 100%;
      padding: 11px 14px;
      background: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-size: 0.88rem;
      outline: none;
      transition: all var(--transition-fast);
    }

    .login-input:focus {
      border-color: #ffffff;
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.08);
      background: var(--bg-hover);
    }

    .login-btn {
      width: 100%;
      padding: 11px;
      font-size: 0.84rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      margin-top: 0.3rem;
    }

    .login-error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.25);
      color: #ef4444;
      font-size: 0.78rem;
      padding: 8px 12px;
      border-radius: var(--radius-xs);
      margin-bottom: 1rem;
      text-align: center;
    }
  </style>
</head>
<body class="mono-theme">
  <div class="login-container">
    <div class="login-card">
      <div class="login-brand">
        <div class="login-logo">🔒</div>
        <div class="login-title">LEETCODE PLANNER</div>
        <div class="login-subtitle">Protected Study Workspace</div>
      </div>

      {% if error %}
      <div class="login-error">{{ error }}</div>
      {% endif %}

      <form method="POST" action="/login" class="login-form">
        <div class="login-field">
          <label class="login-label" for="password">Enter Master Passcode</label>
          <input
            type="password"
            id="password"
            name="password"
            class="login-input"
            placeholder="••••••••••••"
            required
            autofocus
          />
        </div>

        <button type="submit" class="btn btn-primary login-btn">
          Unlock Dashboard →
        </button>
      </form>
    </div>
  </div>
</body>
</html>
